[package]
name = "herdr-linear-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "A Herdr plugin that runs a coordinator and per-repository workers for Linear issues delegated to its app user"
repository = "https://github.com/civitaspo/herdr-linear-agent"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
httparse = "1"
jiff = "0.2"
libc = "0.2"
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
# The version oauth2 already pulls in, so only one reqwest is compiled.
reqwest = { version = "0.13.0", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3", default-features = false }
security-framework-sys = "2"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "=3.27.0"
