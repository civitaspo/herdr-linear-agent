[tools]
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.2"
"aqua:suzuki-shunsuke/ghalint" = "1.6.0"
"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"github:github/gh-actions-lock" = { version = "v0.4.0", bin = "gh-actions-lock" }

[tasks.lint]
description = "Run repository and Rust lint checks"
run = [
  "shellcheck scripts/*.sh",
  "ghalint run",
  "pinact run --check --verify-comment",
  "gh-actions-lock --verify-local",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
]

[tasks.actions-lock]
description = "Regenerate the GitHub Actions dependency lockfile"
run = "gh-actions-lock --no-interactive --no-narrow --no-migrate-local-actions"

[tasks.actions-lock-verify]
description = "Verify GitHub Actions dependency pins against GitHub"
run = "gh-actions-lock --verify"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --workspace --locked"

[tasks.build]
description = "Build the Rust workspace"
run = "cargo build --workspace --locked"

[tasks.build-development]
description = "Build and sign the release binary for local macOS development"
run = """
set -eu
: "${HLA_SIGN_IDENTITY:?Set HLA_SIGN_IDENTITY to your Apple Development signing identity}"
cargo build --release --workspace --locked
codesign --force --sign "$HLA_SIGN_IDENTITY" --identifier dev.herdr-linear-agent --timestamp=none target/release/herdr-linear-agent
codesign --verify --strict target/release/herdr-linear-agent
"""
