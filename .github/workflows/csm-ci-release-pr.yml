name: csm-ci-release-pr

# Each generation is validated against the current default-branch head by the server.
# jactionlint ignore=concurrency-limits
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional semantic version without a v prefix.
        type: string
        required: false

permissions: {}

jobs:
  release-pr:
    if: >-
      github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore(release): v') && !startsWith(github.event.head_commit.message, 'release-pr: chore(release): v'))
    permissions:
      contents: read
    uses: civitaspo/csm-ci-actions/.github/workflows/client-release-prepare.yml@192489747f50f9a8ae156e21be4c51dbe4b927b2
    with:
      version: ${{ inputs.version || '' }}
      update-root-version: false
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
