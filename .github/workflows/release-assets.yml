# Attaches the macOS binaries that scripts/install.sh downloads to a published
# GitHub Release. The release itself is created by civitaspo/securefix-server.

name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, for example v0.1.0
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  assets:
    name: assets
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.14"
          install_args: "--locked"
          cache: false

      - name: Build both architectures
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          mkdir -p dist
          for arch in aarch64 x86_64; do
            cargo build --release --locked --target "$arch-apple-darwin"
            cp "target/$arch-apple-darwin/release/herdr-linear-agent" "dist/herdr-linear-agent-$arch-apple-darwin"
          done
          cd dist
          shasum -a 256 herdr-linear-agent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Check the reported version
        run: |
          version=$(tr -d '[:space:]' < .release-version)
          [ "v$version" = "$TAG" ] || { echo ".release-version is $version, the tag is $TAG" >&2; exit 1; }
          reported=$(dist/herdr-linear-agent-aarch64-apple-darwin --version)
          case "$reported" in
            "herdr-linear-agent $version+"*) echo "$reported" ;;
            *) echo "unexpected version: $reported" >&2; exit 1 ;;
          esac

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber
