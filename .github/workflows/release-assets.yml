# Attaches the macOS and Linux binaries that scripts/install.sh downloads to a
# published GitHub Release. The release itself is created by
# civitaspo/securefix-server.

name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, for example v0.1.0
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  assets:
    name: assets (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.13"
          install_args: "--locked"
          cache: false

      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist
          asset="herdr-linear-agent-$TARGET"
          cp "target/$TARGET/release/herdr-linear-agent" "dist/$asset"
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256" && cat "$asset.sha256")

      - name: Check the reported version
        # The x86_64 macOS binary cannot run on the Apple silicon runner.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          version=$(tr -d '[:space:]' < .release-version)
          [ "v$version" = "$TAG" ] || { echo ".release-version is $version, the tag is $TAG" >&2; exit 1; }
          reported=$("dist/herdr-linear-agent-$TARGET" --version)
          case "$reported" in
            "herdr-linear-agent $version+"*) echo "$reported" ;;
            *) echo "unexpected version: $reported" >&2; exit 1 ;;
          esac

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber
