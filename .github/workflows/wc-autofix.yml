# Pull request autofix. Used from workflow_call_pr.yml.

name: autofix (workflow_call)

on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: 15
    env:
      SECUREFIX_CLIENT_APP_ID: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
      SECUREFIX_SERVER_REPOSITORY: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.15"
          install_args: "--locked"
          cache: false

      - name: Fix action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify-comment

      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions-lock-verify

      - name: Disable checkout credentials
        run: disable-checkout-persist-credentials

      - name: ShellCheck shell scripts
        run: shellcheck scripts/*.sh

      - name: Run ghalint
        run: ghalint run

      - name: Detect automated fixes
        id: fixes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only

      - name: Capture Securefix files
        id: securefix-files
        if: steps.fixes.outputs.changed == 'true'
        run: |
          git ls-files --modified --deleted --others --exclude-standard --deduplicate -z > "$RUNNER_TEMP/securefix-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/securefix-files"
          ((${#files[@]} > 0)) || { echo 'changed files are missing' >&2; exit 1; }
          for file in "${files[@]}"; do
          [[ "$file" != *$'\n'* && "$file" != *$'\r'* && "$file" != ' '* && "$file" != *' ' && "$file" != $'\t'* && "$file" != *$'\t' ]] || { echo 'changed file path cannot be represented' >&2; exit 1; }
          done
          delimiter=securefix-files
          while printf '%s\n' "${files[@]}" | grep -Fqx -- "$delimiter"; do delimiter="${delimiter}x"; done
          { printf 'files<<%s\n' "$delimiter"; printf '%s\n' "${files[@]}"; printf '%s\n' "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Check Securefix configuration
        if: steps.fixes.outputs.changed == 'true'
        id: securefix-config
        env:
          CLIENT_APP_ID: ${{ env.SECUREFIX_CLIENT_APP_ID }}
          CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          SERVER_REPOSITORY: ${{ env.SECUREFIX_SERVER_REPOSITORY }}
        run: |
          if [[ -n "${CLIENT_APP_ID}" && -n "${CLIENT_PRIVATE_KEY}" && "${SERVER_REPOSITORY}" == "securefix-server" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Securefix client token
        id: securefix-client-token
        if: "steps.fixes.outputs.changed == 'true' && steps.securefix-config.outputs.configured == 'true'"
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "3872492"
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: "civitaspo"
          repositories: "securefix-server"
          permission-issues: write

      - name: "Request Securefix commit"
        if: "steps.fixes.outputs.changed == 'true' && steps.securefix-config.outputs.configured == 'true'"
        uses: "civitaspo/securefix-server/.github/actions/client@f80196051161fe4161c42cd9cb7530cc7db79882" # v0.2.36
        with:
          runtime-sha: f80196051161fe4161c42cd9cb7530cc7db79882
          server-repository: "civitaspo/securefix-server"
          runtime-default-branch: "main"
          client-token: ${{ steps.securefix-client-token.outputs.token }}
          files: ${{ steps.securefix-files.outputs.files }}
          commit-message: "ci: apply automated fixes"

      - name: Require Securefix configuration
        if: steps.fixes.outputs.changed == 'true' && steps.securefix-config.outputs.configured != 'true'
        run: |
          echo "Automated fixes are needed, but Securefix client configuration is incomplete." >&2
          echo "Configure SECUREFIX_CLIENT_APP_ID, SECUREFIX_SERVER_REPOSITORY=securefix-server, and SECUREFIX_CLIENT_PRIVATE_KEY." >&2
          exit 1
