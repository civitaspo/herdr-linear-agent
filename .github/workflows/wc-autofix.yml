# Pull request autofix. Used from workflow_call_pr.yml.

name: autofix (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: "2026.10.18"
          install_args: "--locked"
          cache: false

      - name: Fix action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify-comment

      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions-lock-verify

      - name: Disable checkout credentials
        run: disable-checkout-persist-credentials

      - name: ShellCheck shell scripts
        run: shellcheck scripts/*.sh

      - name: Run ghalint
        run: ghalint run

      - name: Request automated fixes
        uses: civitaspo/csm-ci-actions/actions/client/securefix@85d8fc79ef0ca89ec4cc073d142dab75ebe09a66
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          message: "ci: apply automated fixes"
