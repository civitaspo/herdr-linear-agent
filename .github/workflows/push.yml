# Outermost push entry. Fine-grained checks live in workflow_call_push.yml.

name: Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/workflow_call_push.yml
    permissions:
      contents: read
