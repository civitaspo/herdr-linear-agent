# Pull request aggregator. Each wc-* workflow owns one check surface.

name: PR checks (workflow_call)

on:
  workflow_call:
    inputs:
      changed_title_only:
        description: "True when the pull request event only changed the title."
        type: boolean
        required: true
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  rust:
    if: ${{ !inputs.changed_title_only }}
    uses: ./.github/workflows/wc-rust.yml
    permissions:
      contents: read

  autofix:
    if: ${{ !inputs.changed_title_only }}
    uses: ./.github/workflows/wc-autofix.yml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
    permissions:
      contents: read

  pr-title:
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read
