# Push aggregator. Push checks never request Securefix commits or approvals.

name: Push checks (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  rust:
    uses: ./.github/workflows/wc-rust.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/wc-lint.yml
    permissions:
      contents: read
